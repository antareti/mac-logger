<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BLACK TRACE :: CONTROL NODE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#00ff9c;
  font-family:Consolas,monospace;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,0,0,.08) 3px
  );
  pointer-events:none;
  z-index:9999;
}
.panel{
  width:520px;
  background:rgba(0,0,0,.93);
  border:1px solid #00ff9c33;
  border-radius:16px;
  padding:16px;
  box-shadow:0 0 40px rgba(0,255,156,.2);
}
.title{
  text-align:center;
  font-size:18px;
  letter-spacing:3px;
  animation:flicker 4s infinite;
}
@keyframes flicker{
  0%,97%,100%{opacity:1}
  98%{opacity:.6}
  99%{opacity:.3}
}
.tabs{
  display:flex;
  gap:6px;
  margin:12px 0;
}
.tab{
  flex:1;
  padding:10px;
  border:1px solid #00ff9c33;
  background:#000;
  color:#00ff9c;
  cursor:pointer;
  text-align:center;
}
.tab.active{
  background:#00ff9c;
  color:#000;
  font-weight:bold;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#000;
  color:#00ff9c;
  border:1px solid #00ff9c55;
  border-radius:6px;
}
button:hover{
  background:#00ff9c;
  color:#000;
  cursor:pointer;
}
#terminal{
  margin-top:10px;
  background:#000;
  border:1px solid #00ff9c22;
  padding:10px;
  height:110px;
  font-size:12px;
  overflow-y:auto;
}
#map{
  height:260px;
  margin-top:12px;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}
.map-grid{
  position:absolute; inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 19px,rgba(0,255,156,.06) 20px),
    repeating-linear-gradient(90deg,transparent,transparent 19px,rgba(0,255,156,.06) 20px);
  z-index:400;
}
.flashlight{
  position:absolute; inset:0;
  pointer-events:none;
  z-index:500;
}
.face-box{
  margin-top:10px;
  text-align:center;
  display:none;
}
.face-box img{
  width:110px;height:110px;
  border:1px solid #00ff9c55;
  border-radius:6px;
}
.hud{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-top:6px;
}
.fake{
  text-align:center;
  font-size:10px;
  opacity:.35;
  margin-top:6px;
}
#genLink{
  display:none;
  margin-top:10px;
  word-break:break-all;
  color:#00ff9c;
  text-decoration:underline;
}
</style>
</head>

<body>
<div class="panel">

<div class="title">BLACK TRACE :: CONTROL NODE</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('hud',this)">HUD</div>
  <div class="tab" onclick="showTab('gen',this)">GENERATOR</div>
</div>

<div id="hudTab">
  <input placeholder="AA:BB:CC:DD:EE:FF">
  <button onclick="play(sKey); start()">ENGAGE TRACK</button>

  <div id="terminal"></div>

  <div class="face-box" id="faceBox">
    <img id="faceImg">
  </div>

  <div id="map">
    <div class="map-grid"></div>
    <div class="flashlight" id="flashlight"></div>
  </div>

  <div class="hud">
    <span id="hud-coord">LAT -- | LON --</span>
    <span id="hud-speed">SPD --</span>
    <span>SAT LINK</span>
  </div>
</div>

<div id="genTab" style="display:none">
  <input id="gid" placeholder="SESSION ID">
  <button onclick="play(sKey); gen()">GENERATE LINK</button>
  <a id="genLink" target="_blank"></a>
</div>

<div class="fake">SIMULATION · VISUAL ONLY</div>
</div>

<!-- AUDIO -->
<audio id="beep" src="https://www.soundjay.com/button/sounds/button-16.mp3" preload="auto"></audio>
<audio id="radio" src="https://www.soundjay.com/mechanical/sounds/mechanical-switch-1.mp3" preload="auto"></audio>
<audio id="key" src="https://www.soundjay.com/button/sounds/button-3.mp3" preload="auto"></audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* === SOUND === */
const sBeep=document.getElementById("beep");
const sRadio=document.getElementById("radio");
const sKey=document.getElementById("key");
function play(a){
  if(!a) return;
  a.currentTime=0;
  a.volume=0.4;
  a.play().catch(()=>{});
}

/* === TABS === */
function showTab(t,el){
  hudTab.style.display=t==="hud"?"block":"none";
  genTab.style.display=t==="gen"?"block":"none";
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
}

/* === GENERATOR === */
function gen(){
  const id=gid.value.trim();
  if(!id) return alert("NO ID");
  const l=`https://antareti.github.io/mac-logger/trace.html?id=${encodeURIComponent(id)}`;
  genLink.href=l;
  genLink.textContent=l;
  genLink.style.display="block";
}

/* === HUD === */
const term=document.getElementById("terminal");
const faceBox=document.getElementById("faceBox");
const faceImg=document.getElementById("faceImg");
const hudCoord=document.getElementById("hud-coord");
const hudSpeed=document.getElementById("hud-speed");
const flashlight=document.getElementById("flashlight");

let map,marker,circle,timer;

const cities=[
{country:"Россия",city:"Москва",lat:55.7558,lon:37.6173},
{country:"Украина",city:"Киев",lat:50.4501,lon:30.5234},
{country:"Беларусь",city:"Минск",lat:53.9006,lon:27.5590},
{country:"Казахстан",city:"Алматы",lat:43.2389,lon:76.8897},
{country:"Грузия",city:"Тбилиси",lat:41.7151,lon:44.8271}
];

function log(t){
  term.innerHTML+=t+"<br>";
  term.scrollTop=term.scrollHeight;
  play(sBeep);
}

async function loadFace(){
  const r=await fetch("https://randomuser.me/api/?inc=picture&noinfo");
  const j=await r.json();
  faceImg.src=j.results[0].picture.large;
  faceBox.style.display="block";
}

async function start(){
  play(sRadio);
  term.innerHTML="";
  clearInterval(timer);
  await loadFace();

  const loc=cities[Math.floor(Math.random()*cities.length)];
  log(">> COUNTRY: "+loc.country);
  log(">> CITY: "+loc.city);
  log(">> TARGET LOCKED");

  let lat=loc.lat+(Math.random()-.5)*.02;
  let lon=loc.lon+(Math.random()-.5)*.02;

  if(!map){
    map=L.map("map",{zoomControl:false,attributionControl:false})
      .setView([lat,lon],17);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {subdomains:"abcd",maxZoom:20}).addTo(map);
    marker=L.marker([lat,lon]).addTo(map);
    circle=L.circle([lat,lon],{radius:25,color:"#00ff9c",fillOpacity:.15}).addTo(map);
  }

  timer=setInterval(()=>{
    lat+=(Math.random()-.5)*.0003;
    lon+=(Math.random()-.5)*.0003;
    marker.setLatLng([lat,lon]);
    circle.setLatLng([lat,lon]);
    hudCoord.textContent=`LAT ${lat.toFixed(5)} | LON ${lon.toFixed(5)}`;
    hudSpeed.textContent=`SPD ${(20+Math.random()*40).toFixed(1)} km/h`;
  },1200);
}

/* === FLASHLIGHT === */
document.getElementById("map").addEventListener("mousemove",e=>{
  const r=e.currentTarget.getBoundingClientRect();
  flashlight.style.background=
    `radial-gradient(circle 130px at ${e.clientX-r.left}px ${e.clientY-r.top}px,
    rgba(0,0,0,0) 0%, rgba(0,0,0,.15) 45%, rgba(0,0,0,.45) 100%)`;
});
</script>
</body>
</html>
