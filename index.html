<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BLACK TRACE :: TACTICAL HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ff9c;
  font-family: Consolas, monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.panel {
  width: 480px;
  background: rgba(0,0,0,0.93);
  border: 1px solid #00ff9c22;
  border-radius: 14px;
  padding: 16px;
}
h1 {
  text-align: center;
  font-size: 16px;
  letter-spacing: 2px;
}
input, button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #000;
  border: 1px solid #00ff9c55;
  color: #00ff9c;
  border-radius: 6px;
}
button:hover {
  background: #00ff9c;
  color: #000;
  cursor: pointer;
}
#terminal {
  margin-top: 10px;
  background: #000;
  border: 1px solid #00ff9c22;
  padding: 10px;
  height: 110px;
  font-size: 12px;
  overflow-y: auto;
}

/* MAP */
#map {
  height: 280px;
  margin-top: 12px;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

/* GRID */
.map-grid {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg, transparent, transparent 19px, rgba(0,255,156,0.06) 20px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 19px, rgba(0,255,156,0.06) 20px
    );
  z-index: 400;
}

/* FLASHLIGHT — ОСЛАБЛЕН */
.flashlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 500;
  background:
    radial-gradient(
      circle 130px at center,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.08) 45%,
      rgba(0,0,0,0.25) 70%,
      rgba(0,0,0,0.35) 100%
    );
}

/* FACE */
.face-box {
  margin-top: 12px;
  border: 1px solid #00ff9c22;
  padding: 8px;
  border-radius: 10px;
  text-align: center;
}
.face-box img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid #00ff9c55;
}
.face-title {
  font-size: 11px;
  opacity: 0.8;
  margin-bottom: 6px;
}

/* HUD */
.hud {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  margin-top: 6px;
}
.fake {
  text-align: center;
  font-size: 10px;
  opacity: 0.35;
  margin-top: 6px;
}
</style>
</head>

<body>
<div class="panel">
  <h1>BLACK TRACE :: TACTICAL HUD</h1>

  <input placeholder="AA:BB:CC:DD:EE:FF">
  <button onclick="start()">ENGAGE TRACK</button>

  <div id="terminal"></div>

  <div class="face-box" id="faceBox" style="display:none;">
    <div class="face-title">TARGET FACE</div>
    <img id="faceImg">
  </div>

  <div id="map">
    <div class="map-grid"></div>
    <div class="flashlight" id="flashlight"></div>
  </div>

  <div class="hud">
    <span id="hud-coord">LAT -- | LON --</span>
    <span id="hud-speed">SPD -- km/h</span>
    <span>SAT LINK</span>
  </div>

  <div class="fake">SIMULATION · VISUAL ONLY</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const term = document.getElementById("terminal");
const faceBox = document.getElementById("faceBox");
const faceImg = document.getElementById("faceImg");
const hudCoord = document.getElementById("hud-coord");
const hudSpeed = document.getElementById("hud-speed");
const flashlight = document.getElementById("flashlight");

let map, marker, circle, timer;

function log(t){ term.innerHTML += t+"<br>"; }

async function loadFace(){
  const r = await fetch("https://randomuser.me/api/?inc=picture&noinfo");
  const j = await r.json();
  faceImg.src = j.results[0].picture.large;
  faceBox.style.display = "block";
}

async function start(){
  term.innerHTML="";
  clearInterval(timer);
  await loadFace();

  log(">> SATELLITE LINK OK");
  log(">> TARGET LOCKED");

  let lat = 52.52 + (Math.random()-0.5)*0.02;
  let lon = 13.40 + (Math.random()-0.5)*0.02;

  if(!map){
    map = L.map("map",{zoomControl:false, attributionControl:false})
      .setView([lat,lon],17);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {subdomains:"abcd", maxZoom:20}
    ).addTo(map);

    marker = L.marker([lat,lon]).addTo(map);
    circle = L.circle([lat,lon],{
      radius:25,
      color:"#00ff9c",
      fillOpacity:0.15
    }).addTo(map);
  }

  timer = setInterval(()=>{
    lat += (Math.random()-0.5)*0.0003;
    lon += (Math.random()-0.5)*0.0003;
    marker.setLatLng([lat,lon]);
    circle.setLatLng([lat,lon]);
    hudCoord.textContent = `LAT ${lat.toFixed(5)} | LON ${lon.toFixed(5)}`;
    hudSpeed.textContent = `SPD ${(20+Math.random()*40).toFixed(1)} km/h`;
  },1200);
}

/* фонарь за мышью */
document.getElementById("map").addEventListener("mousemove",e=>{
  const r=e.currentTarget.getBoundingClientRect();
  flashlight.style.background =
    `radial-gradient(circle 130px at ${e.clientX-r.left}px ${e.clientY-r.top}px,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.08) 45%,
      rgba(0,0,0,0.25) 70%,
      rgba(0,0,0,0.35) 100%)`;
});
</script>
</body>
</html>
