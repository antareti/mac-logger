<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BLACK TRACE :: TACTICAL HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ff9c;
  font-family: Consolas, monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.panel {
  width: 480px;
  background: rgba(0,0,0,0.93);
  border: 1px solid #00ff9c22;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 0 120px #00ff9c22;
}
h1 {
  text-align: center;
  font-size: 16px;
  letter-spacing: 2px;
}
input, button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #000;
  border: 1px solid #00ff9c55;
  color: #00ff9c;
  border-radius: 6px;
}
button:hover {
  background: #00ff9c;
  color: #000;
  cursor: pointer;
}
#terminal {
  margin-top: 10px;
  background: #000;
  border: 1px solid #00ff9c22;
  padding: 10px;
  height: 120px;
  font-size: 12px;
  overflow-y: auto;
}
#map {
  height: 280px;
  margin-top: 12px;
  border-radius: 10px;
  filter: brightness(0.75) contrast(1.2) hue-rotate(90deg);
  position: relative;
}
.map-grid {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(0,255,156,0.05) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(0,255,156,0.05) 20px);
  pointer-events: none;
  z-index: 999;
}
.hud {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  margin-top: 6px;
}
.fake {
  text-align: center;
  font-size: 10px;
  opacity: 0.35;
  margin-top: 6px;
}
.face-box {
  margin-top: 12px;
  border: 1px solid #00ff9c22;
  padding: 8px;
  border-radius: 10px;
  text-align: center;
  background: #000;
}
.face-box img {
  width: 120px;
  height: 120px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid #00ff9c55;
}
.face-title {
  font-size: 11px;
  opacity: 0.8;
  margin-bottom: 6px;
}
</style>
</head>

<body>

<div class="panel">
  <h1>BLACK TRACE :: TACTICAL HUD</h1>

  <input placeholder="AA:BB:CC:DD:EE:FF">
  <button onclick="start()">ENGAGE TRACK</button>

  <div id="terminal"></div>

  <div class="face-box" id="faceBox" style="display:none;">
    <div class="face-title">TARGET FACE</div>
    <img id="faceImg">
  </div>

  <div id="map"></div>

  <div class="hud">
    <span id="hud-coord">LAT -- | LON --</span>
    <span id="hud-speed">SPD -- km/h</span>
    <span>SAT LINK</span>
  </div>

  <div class="fake">SIMULATION · VISUAL ONLY · NO REAL TRACKING</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const term = document.getElementById("terminal");
const hudCoord = document.getElementById("hud-coord");
const hudSpeed = document.getElementById("hud-speed");
const faceBox = document.getElementById("faceBox");
const faceImg = document.getElementById("faceImg");

let map, marker, circle, moveInterval;

const cities = [
  {name:"Berlin", lat:52.52, lon:13.405, districts:["Mitte","Kreuzberg"]},
  {name:"Paris", lat:48.8566, lon:2.3522, districts:["Montmartre","Latin Quarter"]},
  {name:"Tokyo", lat:35.6895, lon:139.6917, districts:["Shinjuku","Shibuya"]},
  {name:"New York", lat:40.7128, lon:-74.0060, districts:["Manhattan","Brooklyn"]}
];

function log(t){
  term.innerHTML += t + "<br>";
  term.scrollTop = term.scrollHeight;
}
const d = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];

// ✅ ЛИЦО — ВСЕГДА РАБОТАЕТ
async function loadFace(){
  faceBox.style.display = "block";
  faceImg.src = "";

  try {
    const res = await fetch("https://randomuser.me/api/?noinfo");
    const data = await res.json();
    faceImg.src = data.results[0].picture.large;
  } catch(e) {
    faceImg.src =
      "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='100%' height='100%' fill='black'/><text x='50%' y='50%' fill='%2300ff9c' font-size='10' text-anchor='middle'>ERROR</text></svg>";
  }
}

async function start(){
  term.innerHTML = "";
  clearInterval(moveInterval);

  await loadFace();

  log(">> SATELLITE LINK ESTABLISHED");
  await d(500);
  log(">> BIOMETRIC PROFILE LOADED");
  await d(600);
  log(">> GPS TRIANGULATION ACTIVE");

  const city = pick(cities);
  const district = pick(city.districts);

  let lat = city.lat + (Math.random() - 0.5) * 0.02;
  let lon = city.lon + (Math.random() - 0.5) * 0.02;

  log(">> CITY: " + city.name);
  log(">> DISTRICT: " + district);
  log(">> TRACKING TARGET");

  initMap(lat, lon);

  moveInterval = setInterval(() => {
    lat += (Math.random() - 0.5) * 0.0003;
    lon += (Math.random() - 0.5) * 0.0003;

    marker.setLatLng([lat, lon]);
    circle.setLatLng([lat, lon]);

    hudCoord.textContent = `LAT ${lat.toFixed(5)} | LON ${lon.toFixed(5)}`;
    hudSpeed.textContent = `SPD ${(20 + Math.random() * 40).toFixed(1)} km/h`;
  }, 1200);
}

function initMap(lat, lon){
  if (map) return;

  map = L.map('map', {zoomControl:false, attributionControl:false})
    .setView([lat, lon], 17);

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {subdomains:'abcd', maxZoom:19}
  ).addTo(map);

  marker = L.marker([lat, lon]).addTo(map);
  circle = L.circle([lat, lon], {
    radius: 25,
    color: "#00ff9c",
    fillColor: "#00ff9c",
    fillOpacity: 0.15
  }).addTo(map);

  const grid = document.createElement('div');
  grid.className = 'map-grid';
  document.getElementById('map').appendChild(grid);
}
</script>

</body>
</html>
