<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BLACK TRACE :: CITY LOCK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ff9c;
  font-family: Consolas, monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.panel {
  width: 460px;
  background: rgba(0,0,0,0.92);
  border: 1px solid #00ff9c22;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 0 100px #00ff9c22;
}
h1 {
  text-align: center;
  font-size: 17px;
  letter-spacing: 2px;
}
input, button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #000;
  border: 1px solid #00ff9c55;
  color: #00ff9c;
  border-radius: 6px;
}
button:hover {
  background: #00ff9c;
  color: #000;
  cursor: pointer;
}
#terminal {
  margin-top: 12px;
  background: #000;
  border: 1px solid #00ff9c22;
  padding: 10px;
  height: 140px;
  overflow-y: auto;
  font-size: 13px;
}
#map {
  height: 260px;
  margin-top: 14px;
  border-radius: 10px;
  display: none;
}
.fake {
  text-align: center;
  font-size: 11px;
  opacity: 0.35;
  margin-top: 8px;
}
</style>
</head>
<body>

<div class="panel">
  <h1>BLACK TRACE :: GEO CITY</h1>

  <input placeholder="AA:BB:CC:DD:EE:FF">
  <button onclick="scan()">START TRACE</button>

  <div id="terminal"></div>
  <div id="map"></div>

  <div class="fake">REAL CITIES · REAL MAP · FAKE TRACE</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const term = document.getElementById("terminal");
let map, marker;

// Реальные города
const cities = [
  {name:"Berlin", country:"Germany", lat:52.5200, lon:13.4050},
  {name:"Paris", country:"France", lat:48.8566, lon:2.3522},
  {name:"Tokyo", country:"Japan", lat:35.6895, lon:139.6917},
  {name:"New York", country:"USA", lat:40.7128, lon:-74.0060},
  {name:"London", country:"UK", lat:51.5074, lon:-0.1278},
  {name:"Rome", country:"Italy", lat:41.9028, lon:12.4964},
  {name:"Warsaw", country:"Poland", lat:52.2297, lon:21.0122}
];

function log(t){
  term.innerHTML += t+"<br>";
  term.scrollTop = term.scrollHeight;
}
function d(ms){return new Promise(r=>setTimeout(r,ms))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

async function scan(){
  term.innerHTML="";
  document.getElementById("map").style.display="none";

  log(">> initializing satellite uplink");
  await d(600);
  log(">> decrypting network packets");
  await d(600);
  log(">> triangulating signal");
  await d(800);

  const city = pick(cities);

  log(">> country: "+city.country);
  log(">> city: "+city.name);
  log(">> precision: ±4.1m");
  log(">> location confirmed");

  showMap(city.lat, city.lon);
}

function showMap(lat, lon){
  const m = document.getElementById("map");
  m.style.display="block";

  if(!map){
    map = L.map('map',{
      zoomControl:false,
      attributionControl:false
    }).setView([lat,lon], 15);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19 }
    ).addTo(map);

    marker = L.marker([lat,lon]).addTo(map);
  } else {
    map.setView([lat,lon],15);
    marker.setLatLng([lat,lon]);
  }
}
</script>

</body>
</html>
