<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BLACK TRACE :: LINK GENERATOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#000;
  color:#00ff9c;
  font-family:Consolas,monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.panel{
  width:420px;
  border:1px solid #00ff9c33;
  border-radius:12px;
  padding:16px;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#000;
  border:1px solid #00ff9c55;
  color:#00ff9c;
  border-radius:6px;
}
button:hover{
  background:#00ff9c;
  color:#000;
  cursor:pointer;
}
#out{
  margin-top:12px;
  font-size:12px;
  word-break:break-all;
}
</style>
</head>
<body>

<div class="panel">
  <h3 style="text-align:center">BLACK TRACE :: LINK</h3>
  <input id="txt" placeholder="Любой текст (необязательно)">
  <button onclick="gen()">GENERATE LINK</button>
  <div id="out"></div>
</div>

<script>
function gen(){
  const id = Math.random().toString(36).substr(2,8).toUpperCase();
  const link = location.origin + location.pathname.replace("generator.html","") +
               "trace.html?id=" + id;
  document.getElementById("out").innerHTML =
    ">> LINK CREATED:<br><br><a href='"+link+"' style='color:#00ff9c'>"+link+"</a>";
}
</script>

</body>
</html>
