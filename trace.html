<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BLACK TRACE :: TACTICAL HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ff9c;
  font-family: Consolas, monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.panel {
  width: 480px;
  background: rgba(0,0,0,0.93);
  border: 1px solid #00ff9c22;
  border-radius: 14px;
  padding: 16px;
}
h1 {
  text-align: center;
  font-size: 16px;
  letter-spacing: 2px;
}
button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #000;
  border: 1px solid #00ff9c55;
  color: #00ff9c;
  border-radius: 6px;
}
button:hover {
  background: #00ff9c;
  color: #000;
  cursor: pointer;
}
#terminal {
  margin-top: 10px;
  background: #000;
  border: 1px solid #00ff9c22;
  padding: 10px;
  height: 110px;
  font-size: 12px;
  overflow-y: auto;
}
#map {
  height: 280px;
  margin-top: 12px;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}
.map-grid {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg, transparent, transparent 19px, rgba(0,255,156,0.06) 20px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 19px, rgba(0,255,156,0.06) 20px
    );
  z-index: 400;
}
.flashlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 500;
  background:
    radial-gradient(
      circle 130px at center,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.08) 45%,
      rgba(0,0,0,0.25) 70%,
      rgba(0,0,0,0.35) 100%
    );
}
.face-box {
  margin-top: 12px;
  border: 1px solid #00ff9c22;
  padding: 8px;
  border-radius: 10px;
  text-align: center;
}
.face-box img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid #00ff9c55;
}
.face-title {
  font-size: 11px;
  opacity: 0.8;
  margin-bottom: 6px;
}
.hud {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  margin-top: 6px;
}
.fake {
  text-align: center;
  font-size: 10px;
  opacity: 0.35;
  margin-top: 6px;
}
</style>
</head>

<body>
<div class="panel">
  <h1>BLACK TRACE :: TACTICAL HUD</h1>

  <button onclick="start()">ENGAGE TRACK</button>

  <div id="terminal"></div>

  <div class="face-box" id="faceBox" style="display:none;">
    <div class="face-title">TARGET FACE</div>
    <img id="faceImg">
  </div>

  <div id="map">
    <div class="map-grid"></div>
    <div class="flashlight" id="flashlight"></div>
  </div>

  <div class="hud">
    <span id="hud-coord">LAT -- | LON --</span>
    <span id="hud-speed">SPD -- km/h</span>
    <span>SAT LINK</span>
  </div>

  <div class="fake">SIMULATION · VISUAL ONLY</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const term = document.getElementById("terminal");
const faceBox = document.getElementById("faceBox");
const faceImg = document.getElementById("faceImg");
const hudCoord = document.getElementById("hud-coord");
const hudSpeed = document.getElementById("hud-speed");
const flashlight = document.getElementById("flashlight");

let map, marker, circle, timer;

const cities = [
  {country:"Россия", city:"Москва", lat:55.7558, lon:37.6173},
  {country:"Украина", city:"Киев", lat:50.4501, lon:30.5234},
  {country:"Беларусь", city:"Минск", lat:53.9006, lon:27.5590},
  {country:"Казахстан", city:"Алматы", lat:43.2389, lon:76.8897},
  {country:"Узбекистан", city:"Ташкент", lat:41.2995, lon:69.2401},
  {country:"Азербайджан", city:"Баку", lat:40.4093, lon:49.8671},
  {country:"Армения", city:"Ереван", lat:40.1872, lon:44.5152},
  {country:"Грузия", city:"Тбилиси", lat:41.7151, lon:44.8271},
  {country:"Молдова", city:"Кишинёв", lat:47.0105, lon:28.8638}
];

function log(t){
  term.innerHTML += t + "<br>";
  term.scrollTop = term.scrollHeight;
}

async function loadFace(){
  const r = await fetch("https://randomuser.me/api/?inc=picture&noinfo");
  const j = await r.json();
  faceImg.src = j.results[0].picture.large;
  faceBox.style.display = "block";
}

async function start(){
  term.innerHTML = "";
  clearInterval(timer);

  await loadFace();

  const loc = cities[Math.floor(Math.random()*cities.length)];
  log(">> COUNTRY: " + loc.country);
  log(">> CITY: " + loc.city);
  log(">> TARGET LOCKED");

  let lat = loc.lat + (Math.random()-0.5)*0.02;
  let lon = loc.lon + (Math.random()-0.5)*0.02;

  if(!map){
    map = L.map("map",{zoomControl:false, attributionControl:false})
      .setView([lat,lon],17);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {subdomains:"abcd", maxZoom:20}
    ).addTo(map);

    marker = L.marker([lat,lon]).addTo(map);
    circle = L.circle([lat,lon],{
      radius:25,
      color:"#00ff9c",
      fillOpacity:0.15
    }).addTo(map);
  }

  timer = setInterval(()=>{
    lat += (Math.random()-0.5)*0.0003;
    lon += (Math.random()-0.5)*0.0003;
    marker.setLatLng([lat,lon]);
    circle.setLatLng([lat,lon]);
    hudCoord.textContent = `LAT ${lat.toFixed(5)} | LON ${lon.toFixed(5)}`;
    hudSpeed.textContent = `SPD ${(20+Math.random()*40).toFixed(1)} km/h`;
  },1200);
}

/* === AUTO START FROM LINK === */
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (id) {
    log(">> LINK ID: " + id);
    log(">> REMOTE SESSION OPEN");
    start();
  }
});

/* FLASHLIGHT EFFECT */
document.getElementById("map").addEventListener("mousemove", e => {
  const r = e.currentTarget.getBoundingClientRect();
  flashlight.style.background =
    `radial-gradient(circle 130px at ${e.clientX - r.left}px ${e.clientY - r.top}px,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.08) 45%,
      rgba(0,0,0,0.25) 70%,
      rgba(0,0,0,0.35) 100%)`;
});
</script>
</body>
</html>
